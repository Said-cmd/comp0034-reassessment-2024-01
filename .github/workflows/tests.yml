name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e .
          playwright install --with-deps chromium

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check .

      - name: Run tests with coverage
        run: pytest -v --cov=summersports --cov-report=term-missing