[project]
name = "comp0034-reassessment-2024"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pytest",
    "dash[testing]",
    "pandas",
    "numpy",
    "pytest-playwright",
    "pytest-cov",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]
# tests use GIVEN/WHEN/THEN or ARRANGE/ACT/ASSERT comments instead of docstrings
per-file-ignores = { "tests/*" = ["D103"] }